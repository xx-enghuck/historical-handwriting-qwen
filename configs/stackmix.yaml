extends: sft.yaml
stackmix:
  enabled: true
  synthetic_ratio: 1.0
  ctc_checkpoint: artifacts/ctc/model.pt
  ctc_epochs: 30
  ctc_learning_rate: 0.001
  bank_dir: artifacts/stackmix
  synthetic_dir: data/dummy/synthetic
  height: 48
  min_quality: 0.5
  max_alignment_cer: 0.25
  spacing: 0
  word_spacing: 16
  style_consistent: false
  min_words: 2
  max_words: 8
train:
  output_dir: runs/stackmix_sft
