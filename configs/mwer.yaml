extends: stackmix.yaml
train:
  checkpoint: runs/stackmix_sft/best
  output_dir: runs/mwer
  learning_rate: 0.00001
  epochs: 2
  batch_size: 1
  gradient_accumulation: 8
mwer:
  nbest_path: artifacts/nbest/train.jsonl
  num_beams: 4
  num_return_sequences: 4
  length_normalization: 0.0
  center_risks: true
  lambda_ce: 0.1
  # Used only by the all-stage ablation runner; direct train-mwer uses train.*.
  ablation_learning_rate: 0.00001
  ablation_epochs: 2
