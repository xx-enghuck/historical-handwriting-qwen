[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-handwriting-qwen"
version = "0.1.0"
description = "Qwen2.5-VL handwriting recognition with LoRA and MWER"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "torch==2.14.0", "torchvision==0.29.0", "transformers==5.17.0", "peft==0.21.0",
  "accelerate==1.15.0", "Pillow==12.3.0", "PyYAML==6.0.3",
  "numpy==2.5.3", "safetensors==0.8.0",
]

[project.scripts]
htr = "htr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
